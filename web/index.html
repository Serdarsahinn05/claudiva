<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claudiva</title>
    <!--
      Temayı ilk boyamadan ÖNCE uygula. React'e bırakılırsa sayfa bir kare
      boyunca varsayılan temayla çizilir ve tema sıçraması görünür.
      Bilinmeyen/bozuk değerler CSS tarafında sessizce varsayılana düşer.
    -->
    <!--
      DİKKAT: buradaki yedek ad varsayılan temayı GERÇEKTEN belirler.
      Açılışta `setTheme()` çağıran hiçbir yer yok — `themes.ts` içindeki
      DEFAULT_THEME yalnızca seçicinin ve `getTheme()`in bildiği değer.
      Yani ikisi ayrışırsa panel bir temayla boyanır, seçici başka bir temayı
      işaretli gösterir. İkisi birlikte değiştirilmeli.
    -->
    <!--
      Eski anahtar adları (`claude-manager.*`) burada, bundle'dan ÖNCE bir kez
      `claudiva.*`ya taşınır. Modüller (themes.ts, cliSkins.ts) anahtarı modül
      yüklenirken okuyor; taşıma onlardan sonra yapılsaydı ilk açılış eski
      tercihleri görmezdi.
    -->
    <script>
      try {
        ['theme', 'cli', 'layout.v1'].forEach(function (k) {
          var old = localStorage.getItem('claude-manager.' + k);
          if (old !== null && localStorage.getItem('claudiva.' + k) === null) {
            localStorage.setItem('claudiva.' + k, old);
          }
          localStorage.removeItem('claude-manager.' + k);
        });
      } catch (e) {}
      // Belge dili (ekran okuyucular doğru dili seslendirsin). Mantık
      // i18n/index.ts'deki detect() ile AYNI olmak zorunda.
      try {
        var lc = localStorage.getItem('claudiva.locale');
        if (lc !== 'tr' && lc !== 'en') lc = (navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
        document.documentElement.lang = lc;
      } catch (e) {}
      // Stil (styles.css). Yedek ad appStyle.ts DEFAULT_STYLE ile AYNI olmalı.
      try {
        var st = localStorage.getItem('claudiva.style');
        document.documentElement.dataset.style = st === 'studio' ? st : 'observatory';
      } catch (e) {
        document.documentElement.dataset.style = 'observatory';
      }
      try {
        var t = localStorage.getItem('claudiva.theme');
        document.documentElement.dataset.theme = t || 'obsidian';
      } catch (e) {
        document.documentElement.dataset.theme = 'obsidian';
      }
    </script>
    <!--
      Açılış perdesi burada, React'te DEĞİL.

      React'e konsaydı ancak bundle ayrıştırıldıktan sonra görünürdü — yani
      örtmeye çalıştığı boşluğun tam ortasında belirirdi. Statik markup ilk
      karede boyanır ve bundle + ilk veri isteği boyunca ekranda kalır.

      Renkler token'dan okunur; yedek değerler yalnızca `npm run dev`in ilk
      karelerinde devreye girer (üretimde CSS <link>'i boyamayı bloklar, yani
      token'lar zaten hazırdır).
    -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 999;
        display: grid; place-items: center;
        background: var(--void, #030406);
        /* Perde ANINDA opak: fade-in koysaydık örttüğü boş sayfa görünürdü. */
      }
      /* İçerik gecikmeli girer: hızlı açılışta (< ~140ms) hiç görünmez, yani
         sunucu ayaktayken kullanıcı yalnızca düz bir zemin görüp panele geçer.
         `backwards` — `both` DEĞİL: gecikme boyunca ilk kareyi tutar. */
      #boot .boot-in {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        animation: boot-rise 320ms cubic-bezier(0.23, 1, 0.32, 1) 140ms backwards;
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to   { opacity: 1; transform: none; }
      }
      /* Başlıktaki adla AYNI font ve AYNI biçim: perde kalkınca aynı kelime
         yerinde kalsın (süreklilik). Font henüz inmemişken Georgia italiği
         devralır — aynı karakter, aynı eğim. */
      #boot .boot-mark {
        font-family: var(--font-display, 'Bodoni Moda', Georgia, serif);
        font-style: var(--title-style, italic); font-weight: var(--title-weight, 400); font-size: 26px; letter-spacing: 0;
        color: rgb(var(--fg-rgb, 233 240 246));
      }
      /* Belirsiz ilerleme: sahte yüzde göstermek yalan olurdu — yalnızca
         "çalışıyor" bilgisi veriyor. Sadece transform animasyonu. */
      #boot .boot-scan {
        width: 190px; height: 1px; overflow: hidden;
        background: rgb(var(--fg-rgb, 233 240 246) / 0.14);
      }
      #boot .boot-scan::after {
        content: ''; display: block; width: 34%; height: 100%;
        background: rgb(var(--accent-rgb, 34 211 238));
        animation: boot-scan 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-scan {
        from { transform: translateX(-100%); }
        to   { transform: translateX(350%); }
      }
      #boot .boot-status {
        font-family: ui-monospace, monospace; font-size: 10px;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: rgb(var(--fg-rgb, 233 240 246) / 0.42);
      }
      /* Çıkış: panel altta hazır, perde önden çekiliyor. Blur geçişi iki
         durumu birbirine bağlar (sert kesme yerine). */
      #boot.boot-out {
        opacity: 0; transform: scale(1.012); filter: blur(3px);
        pointer-events: none;
        transition:
          opacity 260ms cubic-bezier(0.23, 1, 0.32, 1),
          transform 260ms cubic-bezier(0.23, 1, 0.32, 1),
          filter 260ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      /**
       * Azaltılmış hareket: mekânsal hareket kalkar, GERİ BİLDİRİM KALMAZ
       * DEĞİL. Tarama çubuğu yavaş bir nabza dönüşür — tamamen durdurmak
       * "panel dondu" izlenimi verirdi.
       */
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-in { animation: boot-fade 200ms ease-out 140ms backwards; }
        @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
        #boot .boot-scan::after {
          width: 100%;
          animation: boot-pulse 1.8s ease-in-out infinite;
        }
        @keyframes boot-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        #boot.boot-out { transform: none; filter: none; }
      }
    </style>
  </head>
  <body>
    <!--
      YÖN SÖZLEŞMESİ — gök plakası · anahtar 7d9cf4fa

      THESIS: Proje durumu bir gösterge tablosu değil, bir GÖK PLAKASIDIR.
      Kategorinin kart ızgarası + durum hapları + sparkline düzenini reddeder.
      OWN-WORLD: Gece mürekkebi zemin, yıldız tozu metin, tek vermilyon ek
      açıklama; hairline cetveller, gravür italiği (Bodoni) + Archivo + mono
      koordinatlar; hale ve pah yok, kadir noktası var.
      STORY: Kullanıcı açar açmaz kimin çalıştığını, kimin onay beklediğini ve
      neyin durduğunu tek cümle + tek bakışta görür; yıldıza tıklar, terminaline
      düşer.
      FIRST VIEWPORT: Üstte durum cümlesi (en büyük tipografi), altında
      gökyüzü — ajanlar kadire göre yıldız, delegasyon takımyıldız çizgisi,
      kapalı ajanlar ufkun altında; sağ kenarda bütçe/kota/token okumaları.
      FORM: Yıldız atlası — kullanıcının seçtiği meydan okuyan (atış 7. adayı
      vermişti; kullanıcı seçimi atışı ezer). Anahtar 7d9cf4fa.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <div id="boot">
      <div class="boot-in">
        <div class="boot-mark">claudiva</div>
        <div class="boot-scan"></div>
        <div class="boot-status" id="boot-status">sunucuya bağlanılıyor</div>
        <script>
          // Perde bundle'dan önce çizilir; ilk metni de dile göre burada seçilir.
          if (document.documentElement.lang === 'en') {
            document.getElementById('boot-status').textContent = 'connecting to the server';
          }
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

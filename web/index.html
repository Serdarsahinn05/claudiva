<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Manager</title>
    <!--
      Temayı ilk boyamadan ÖNCE uygula. React'e bırakılırsa sayfa bir kare
      boyunca varsayılan temayla çizilir ve tema sıçraması görünür.
      Bilinmeyen/bozuk değerler CSS tarafında sessizce varsayılana düşer.
    -->
    <script>
      try {
        var t = localStorage.getItem('claude-manager.theme');
        document.documentElement.dataset.theme = t || 'spaceship';
      } catch (e) {
        document.documentElement.dataset.theme = 'spaceship';
      }
    </script>
    <!--
      Açılış perdesi burada, React'te DEĞİL.

      React'e konsaydı ancak bundle ayrıştırıldıktan sonra görünürdü — yani
      örtmeye çalıştığı boşluğun tam ortasında belirirdi. Statik markup ilk
      karede boyanır ve bundle + ilk veri isteği boyunca ekranda kalır.

      Renkler token'dan okunur; yedek değerler yalnızca `npm run dev`in ilk
      karelerinde devreye girer (üretimde CSS <link>'i boyamayı bloklar, yani
      token'lar zaten hazırdır).
    -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 999;
        display: grid; place-items: center;
        background: var(--void, #05080c);
        /* Perde ANINDA opak: fade-in koysaydık örttüğü boş sayfa görünürdü. */
      }
      /* İçerik gecikmeli girer: hızlı açılışta (< ~140ms) hiç görünmez, yani
         sunucu ayaktayken kullanıcı yalnızca düz bir zemin görüp panele geçer.
         `backwards` — `both` DEĞİL: gecikme boyunca ilk kareyi tutar. */
      #boot .boot-in {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        animation: boot-rise 320ms cubic-bezier(0.23, 1, 0.32, 1) 140ms backwards;
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to   { opacity: 1; transform: none; }
      }
      /* Başlıktaki logoyla AYNI font: perde kalkınca aynı kelime aynı
         biçimde yerinde kalsın (süreklilik). Farklı bir yazı tipi seçmek
         perdeyi ayrı bir ekran gibi gösterirdi. */
      #boot .boot-mark {
        font-family: var(--font-display, 'Audiowide', 'Segoe UI', system-ui, sans-serif);
        font-size: 20px; letter-spacing: 0.06em;
        color: rgb(var(--fg-rgb, 219 228 238));
        text-transform: uppercase;
        text-shadow: 0 0 14px rgb(var(--hud-rgb, 92 225 230) / 0.25);
      }
      /* Belirsiz ilerleme: sahte yüzde göstermek yalan olurdu — yalnızca
         "çalışıyor" bilgisi veriyor. Sadece transform animasyonu. */
      #boot .boot-scan {
        width: 190px; height: 2px; overflow: hidden;
        background: rgb(var(--fg-rgb, 219 228 238) / 0.12);
      }
      #boot .boot-scan::after {
        content: ''; display: block; width: 40%; height: 100%;
        background: rgb(var(--hud-rgb, 92 225 230));
        animation: boot-scan 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-scan {
        from { transform: translateX(-100%); }
        to   { transform: translateX(350%); }
      }
      #boot .boot-status {
        font-family: ui-monospace, monospace; font-size: 11px;
        letter-spacing: 0.08em;
        color: rgb(var(--fg-rgb, 219 228 238) / 0.45);
      }
      /* Çıkış: panel altta hazır, perde önden çekiliyor. Blur geçişi iki
         durumu birbirine bağlar (sert kesme yerine). */
      #boot.boot-out {
        opacity: 0; transform: scale(1.012); filter: blur(3px);
        pointer-events: none;
        transition:
          opacity 260ms cubic-bezier(0.23, 1, 0.32, 1),
          transform 260ms cubic-bezier(0.23, 1, 0.32, 1),
          filter 260ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      /**
       * Azaltılmış hareket: mekânsal hareket kalkar, GERİ BİLDİRİM KALMAZ
       * DEĞİL. Tarama çubuğu yavaş bir nabza dönüşür — tamamen durdurmak
       * "panel dondu" izlenimi verirdi.
       */
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-in { animation: boot-fade 200ms ease-out 140ms backwards; }
        @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
        #boot .boot-scan::after {
          width: 100%;
          animation: boot-pulse 1.8s ease-in-out infinite;
        }
        @keyframes boot-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
        #boot.boot-out { transform: none; filter: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="boot-in">
        <div class="boot-mark">Claude Manager</div>
        <div class="boot-scan"></div>
        <div class="boot-status" id="boot-status">sunucuya bağlanılıyor</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

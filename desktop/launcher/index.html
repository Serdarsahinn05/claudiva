<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claudiva</title>
<!--
  Masaüstü açılış ekranı. Panelin kendisi değil: proje klasörü seçilir,
  kabuk (src-tauri/src/lib.rs) sunucuyu başlatıp pencereyi panele götürür.
  Görünüm panelin varsayılan stili Cam'dan (web/DESIGN.md "Styles"):
  açıkta `mist`, koyuda `grove` paleti, Sora, 10/18px köşe, buzlu kart.
  Derleme adımı yok, bağımlılık yok; Tauri API'si `withGlobalTauri` ile gelir.
-->
<style>
  @font-face { font-family: Sora; font-weight: 400; font-display: swap;
    src: url(fonts/sora-latin-400-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Sora; font-weight: 400; font-display: swap;
    src: url(fonts/sora-latin-ext-400-normal.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Sora; font-weight: 600; font-display: swap;
    src: url(fonts/sora-latin-600-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Sora; font-weight: 600; font-display: swap;
    src: url(fonts/sora-latin-ext-600-normal.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

  /* mist (Cam · açık) */
  :root {
    color-scheme: light;
    --bg-rgb: 235 241 239;
    --surface-rgb: 255 255 255;
    --surface-2-rgb: 245 249 247;
    --edge-rgb: 215 228 223;
    --edge-lit-rgb: 190 209 202;
    --fg-rgb: 18 26 28;
    --muted-rgb: 84 98 104;
    --dim-rgb: 102 116 122;
    --accent-rgb: 10 120 82;
    --accent-glow-rgb: 72 222 168;
    --accent-fill: rgb(140 232 196);
    --accent-fill-fg: rgb(4 56 38);
    --aura-2-rgb: 203 196 245;
    --aura-2-a: 0.45;
    --glass-a: 0.72;
    --err-rgb: 200 38 38;
    --shadow-card: 0 1px 2px rgb(16 32 40 / 0.05), 0 8px 24px -12px rgb(16 32 40 / 0.16);
    --radius: 10px;
    --radius-lg: 18px;
    --font: Sora, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    --mono: 'Cascadia Mono', Consolas, ui-monospace, monospace;
  }
  /* grove (Cam · koyu) */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg-rgb: 5 11 9;
      --surface-rgb: 13 27 23;
      --surface-2-rgb: 19 36 31;
      --edge-rgb: 31 54 47;
      --edge-lit-rgb: 54 88 78;
      --fg-rgb: 232 243 239;
      --muted-rgb: 138 167 159;
      --dim-rgb: 108 138 129;
      --accent-rgb: 62 224 192;
      --accent-glow-rgb: 110 255 210;
      --accent-fill: rgb(62 224 192);
      --accent-fill-fg: rgb(3 42 34);
      --aura-2-rgb: 18 90 64;
      --aura-2-a: 0.55;
      --glass-a: 0.5;
      --err-rgb: 251 113 133;
      --shadow-card: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 10px 30px -14px rgb(0 0 0 / 0.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    color: rgb(var(--fg-rgb));
    background:
      radial-gradient(900px 620px at 100% -10%, rgb(var(--accent-glow-rgb) / 0.42), transparent 70%),
      radial-gradient(760px 560px at -10% 110%, rgb(var(--aura-2-rgb) / var(--aura-2-a)), transparent 70%),
      rgb(var(--bg-rgb));
    display: grid;
    place-items: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(560px, 100%);
    background: rgb(var(--surface-rgb) / var(--glass-a));
    backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid rgb(var(--edge-rgb));
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 32px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { flex: none; color: rgb(var(--accent-rgb)); }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .lead { color: rgb(var(--muted-rgb)); margin: 8px 0 24px; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid rgb(var(--accent-rgb)); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: 0.55; }

  .primary {
    width: 100%;
    padding: 12px 16px;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent-fill);
    color: var(--accent-fill-fg);
    font-weight: 600;
    transition: filter 160ms ease-out, transform 160ms ease-out;
  }
  .primary:hover:not(:disabled) { filter: brightness(1.05); }
  .primary:active:not(:disabled) { transform: translateY(1px); }

  h2 {
    font-size: 12px;
    font-weight: 600;
    color: rgb(var(--muted-rgb));
    margin: 28px 0 8px;
  }
  /* `minmax(0, 1fr)` ŞART: ızgara sütunu varsayılan olarak içeriğin en kısa
     genişliğinin altına inmez ve `nowrap` yol sütunu (ve kartı) yolun tam
     boyuna uzatıyordu (kullanıcı ekran görüntüsü). */
  .recent { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .recent li { display: flex; align-items: stretch; gap: 6px; min-width: 0; }
  .open {
    flex: 1;
    min-width: 0;
    text-align: left;
    padding: 10px 12px;
    background: rgb(var(--surface-2-rgb) / 0.7);
    border: 1px solid rgb(var(--edge-rgb));
    border-radius: var(--radius);
    transition: border-color 160ms ease-out, background-color 160ms ease-out;
  }
  .open:hover:not(:disabled) { border-color: rgb(var(--edge-lit-rgb)); background: rgb(var(--surface-rgb)); }
  .open b {
    display: block;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .open span {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: rgb(var(--dim-rgb));
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .forget {
    flex: none;
    width: 36px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: transparent;
    color: rgb(var(--dim-rgb));
    font-size: 18px;
    line-height: 1;
  }
  .forget:hover:not(:disabled) { color: rgb(var(--fg-rgb)); border-color: rgb(var(--edge-rgb)); }

  .status {
    margin-top: 20px;
    min-height: 1.5em;
    color: rgb(var(--muted-rgb));
    font-size: 13px;
  }
  .status.busy::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    background: rgb(var(--accent-rgb));
    vertical-align: 1px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .status.busy::before { animation: none; } }

  .error {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid rgb(var(--err-rgb) / 0.4);
    background: rgb(var(--err-rgb) / 0.08);
  }
  .error p { margin: 0; }
  .error details { margin-top: 8px; }
  .error summary { cursor: pointer; color: rgb(var(--muted-rgb)); font-size: 13px; }
  .error pre {
    margin: 8px 0 0;
    max-height: 220px;
    overflow: auto;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: rgb(var(--muted-rgb));
  }
  .foot { margin-top: 24px; font-size: 12px; color: rgb(var(--dim-rgb)); }

  /* Windows başlık çubuğu yok (decorations: false): sürükleme şeridi +
     pencere düğmeleri. Şeridin kendisi sürükler; düğmeler sürüklemez. */
  .titlebar {
    position: fixed; inset: 0 0 auto 0; height: 40px;
    display: flex; justify-content: flex-end; align-items: center;
    padding: 0 6px; user-select: none; -webkit-user-select: none;
  }
  .win-btn {
    width: 40px; height: 30px; border: 0; border-radius: 8px;
    background: transparent; color: rgb(var(--muted-rgb));
    display: grid; place-items: center;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .win-btn:hover { background: rgb(var(--fg-rgb) / 0.08); color: rgb(var(--fg-rgb)); }
  .win-btn.close:hover { background: rgb(var(--err-rgb)); color: rgb(var(--surface-rgb)); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="titlebar" data-tauri-drag-region>
  <button class="win-btn" id="win-min" type="button">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" aria-hidden="true"><path d="M0.5 5h9" /></svg>
  </button>
  <button class="win-btn" id="win-max" type="button">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" /></svg>
  </button>
  <button class="win-btn close" id="win-close" type="button">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" /></svg>
  </button>
</div>
<main class="card">
  <div class="brand">
    <!-- Logo, küçük çizim (docs/brand/claudiva-mark-small-dark.svg); renkler paletten. -->
    <svg width="30" height="30" viewBox="0 0 256 256" aria-hidden="true">
      <path fill="rgb(var(--accent-rgb))" fill-rule="evenodd" d="M136.50 17.28 L219.64 65.28 A17.0 17.0 0 0 1 228.14 80.00 L228.14 176.00 A17.0 17.0 0 0 1 219.64 190.72 L136.50 238.72 A17.0 17.0 0 0 1 119.50 238.72 L36.36 190.72 A17.0 17.0 0 0 1 27.86 176.00 L27.86 80.00 A17.0 17.0 0 0 1 36.36 65.28 L119.50 17.28 A17.0 17.0 0 0 1 136.50 17.28 Z M61.86 89.81 L61.86 166.19 L128.00 204.37 L194.14 166.19 L194.14 89.81 L128.00 51.63 Z" />
      <path fill="rgb(var(--fg-rgb))" d="M156.20 85.16 L179.20 125.00 A6 6 0 0 1 179.20 131.00 L156.20 170.84 A6 6 0 0 1 151.00 173.84 L105.00 173.84 A6 6 0 0 1 99.80 170.84 L76.80 131.00 A6 6 0 0 1 76.80 125.00 L99.80 85.16 A6 6 0 0 1 105.00 82.16 L151.00 82.16 A6 6 0 0 1 156.20 85.16 Z" />
    </svg>
    <h1>Claudiva</h1>
  </div>
  <p class="lead" id="lead"></p>

  <button class="primary" id="pick" type="button"></button>

  <section id="recent-wrap" hidden>
    <h2 id="recent-title"></h2>
    <ul class="recent" id="recent"></ul>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="error" id="error" role="alert" hidden>
    <p id="error-text"></p>
    <details id="error-log" hidden>
      <summary id="error-log-title"></summary>
      <pre id="error-log-body"></pre>
    </details>
  </div>

  <p class="foot" id="foot"></p>
</main>

<script>
  const TR = (navigator.language || '').toLowerCase().startsWith('tr');
  document.documentElement.lang = TR ? 'tr' : 'en';

  const L = TR
    ? {
        lead: 'Bir proje klasörü seç. Ajanlar o klasörde çalışır, verileri de orada tutulur.',
        pick: 'Klasör seç',
        dialog: 'Proje klasörü',
        recent: 'Son projeler',
        forget: (n) => `${n} listeden kaldır`,
        starting: (n) => `Sunucu başlatılıyor · ${n}`,
        node: (v) => `Node ${v}`,
        log: 'Sunucu günlüğü',
        win: { min: 'Küçült', max: 'Büyüt', close: 'Kapat' },
        errors: {
          node_missing: 'Node.js bulunamadı. Claudiva, Node 20 ya da üstünü ister: nodejs.org adresinden kurup uygulamayı yeniden aç.',
          node_old: (v) => `Node ${v} çok eski. Claudiva, Node 20 ya da üstünü ister.`,
          missing_dir: 'Klasör artık yok.',
          not_built: 'Sunucu dosyaları eksik. Geliştirme sürümündeysen depo kökünde `npm run build` çalıştır.',
          no_port: '4600-4699 aralığında boş port yok.',
          exited: 'Sunucu açılırken kapandı.',
          timeout: 'Sunucu 45 saniyede açılmadı.',
          other: 'Sunucu başlatılamadı.',
        },
      }
    : {
        lead: 'Pick a project folder. The agents work in it and keep their data there.',
        pick: 'Choose folder',
        dialog: 'Project folder',
        recent: 'Recent projects',
        forget: (n) => `Remove ${n} from the list`,
        starting: (n) => `Starting the server · ${n}`,
        node: (v) => `Node ${v}`,
        log: 'Server log',
        win: { min: 'Minimize', max: 'Maximize', close: 'Close' },
        errors: {
          node_missing: 'Node.js was not found. Claudiva needs Node 20 or later: install it from nodejs.org and reopen the app.',
          node_old: (v) => `Node ${v} is too old. Claudiva needs Node 20 or later.`,
          missing_dir: 'The folder no longer exists.',
          not_built: 'The server files are missing. In a development build, run `npm run build` in the repository root.',
          no_port: 'No free port between 4600 and 4699.',
          exited: 'The server stopped while starting.',
          timeout: 'The server did not start within 45 seconds.',
          other: 'The server could not start.',
        },
      };

  const $ = (id) => document.getElementById(id);
  const { invoke } = window.__TAURI__.core;
  const { open } = window.__TAURI__.dialog;

  $('lead').textContent = L.lead;
  $('pick').textContent = L.pick;
  $('recent-title').textContent = L.recent;
  $('error-log-title').textContent = L.log;

  const win = window.__TAURI__.window.getCurrentWindow();
  for (const [id, label, act] of [
    ['win-min', L.win.min, () => win.minimize()],
    ['win-max', L.win.max, () => win.toggleMaximize()],
    ['win-close', L.win.close, () => win.close()],
  ]) {
    $(id).setAttribute('aria-label', label);
    $(id).title = label;
    $(id).addEventListener('click', act);
  }

  const baseName = (p) => p.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;

  let busy = false;
  let nodeOk = false;

  function setBusy(on, dir) {
    busy = on;
    // Yalnız karttakiler: pencere düğmeleri Node yokken de çalışmalı.
    document.querySelectorAll('main button').forEach((b) => (b.disabled = on || !nodeOk));
    const s = $('status');
    s.classList.toggle('busy', on);
    s.textContent = on ? L.starting(baseName(dir)) : '';
  }

  function showError(code) {
    const [kind, ...rest] = String(code).split(':');
    const detail = rest.join(':');
    const msg = L.errors[kind];
    $('error-text').textContent =
      typeof msg === 'function' ? msg(detail) : msg || `${L.errors.other} ${code}`;
    const hasLog = (kind === 'exited' || kind === 'timeout') && detail.trim();
    $('error-log').hidden = !hasLog;
    $('error-log-body').textContent = hasLog ? detail : '';
    $('error').hidden = false;
  }

  async function openProject(dir) {
    if (busy || !dir) return;
    $('error').hidden = true;
    setBusy(true, dir);
    try {
      // Başarıda kabuk pencereyi panele götürür; bu sayfa kapanır.
      await invoke('open_project', { dir });
    } catch (e) {
      setBusy(false);
      showError(e);
      renderRecent();
    }
  }

  async function renderRecent() {
    const list = await invoke('recent_projects');
    const ul = $('recent');
    ul.replaceChildren();
    for (const dir of list) {
      const li = document.createElement('li');
      const openBtn = document.createElement('button');
      openBtn.type = 'button';
      openBtn.className = 'open';
      const b = document.createElement('b');
      b.textContent = baseName(dir);
      const span = document.createElement('span');
      span.textContent = dir;
      openBtn.append(b, span);
      openBtn.title = dir;
      openBtn.addEventListener('click', () => openProject(dir));

      const forget = document.createElement('button');
      forget.type = 'button';
      forget.className = 'forget';
      forget.textContent = '×';
      forget.setAttribute('aria-label', L.forget(baseName(dir)));
      forget.title = L.forget(baseName(dir));
      forget.addEventListener('click', async () => {
        await invoke('forget_project', { dir });
        renderRecent();
      });

      li.append(openBtn, forget);
      ul.append(li);
    }
    $('recent-wrap').hidden = list.length === 0;
    setBusy(busy);
  }

  $('pick').addEventListener('click', async () => {
    const dir = await open({ directory: true, multiple: false, title: L.dialog });
    if (typeof dir === 'string') openProject(dir);
  });

  (async () => {
    try {
      const v = await invoke('node_version');
      nodeOk = true;
      $('foot').textContent = L.node(v);
    } catch (e) {
      showError(e);
    }
    await renderRecent();
    if (nodeOk) $('pick').focus();
  })();
</script>
</body>
</html>
